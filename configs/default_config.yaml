# Team Owner: Kumar (Coordinates configs)
# Workstream: Project Configuration
# File: configs/default_config.yaml
# Description: Global project configuration for the application layer and the
#              hybrid fusion settings.
#
# Loaded by app/config.py. Every key is optional: a missing key (or a missing
# file) falls back to the same defaults written here. Override the file path
# with the P4_CONFIG environment variable.

# ---------------------------------------------------------------------------
# Hybrid fusion
# ---------------------------------------------------------------------------
hybrid:
  # null adapts to LR noise and missing pixels. A number in [0, 1] sets a
  # fixed classical fraction for comparisons.
  classical_alpha: null

  # Measurement-consistency correction r_LR = D_LR - S(D_f), applied only
  # because the synthetic bicubic forward operator is known.
  use_consistency: true
  consistency_strength: 0.25
  consistency_iterations: 1

  # Boundary refinement worsened validation RMSE, so it stays off.
  use_boundary_refinement: false

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
app:
  default_method: hybrid
  default_scale: 4
  # Scales offered in the UI / CLI. Classical methods support any of these;
  # the deep branch (SGNet) supports 4, 8 and 16 only.
  scales: [2, 4, 8, 16]
  deep_scales: [4, 8, 16]
  # Fixed depth range (metres) used for PSNR/SSIM when a ground truth is given.
  data_range: 10.0
  # Default output directory for the CLI.
  output_dir: tmp/app_output
