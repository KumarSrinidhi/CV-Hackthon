[project]
name = "ps4"
version = "0.1.0"
description = "PS4 - Edge-preserving depth map upsampling and refinement"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "scipy>=1.14",
    "h5py>=3.11",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-image>=0.21",
    "pillow>=10.4",
    "torch>=2.4",
    "gradio>=4.44",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps4"]
